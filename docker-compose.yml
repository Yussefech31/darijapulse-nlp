services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: darijapulse-api
    command: uvicorn src.darijapulse.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: darijapulse-ui
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
